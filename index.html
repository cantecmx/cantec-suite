<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CANTEC Suite — Todo en un solo lugar.</title>
<style>
  :root{
    --ink:#eef0f4;
    --ink2:#c9cdd4;
    --ink3:#4a5059;
    --gold:#F2A81D;
    --gold-d:#cf8d0b;
    --gold-l:#ffc24d;
    --neon:#ffc93d;
    --gray:#8b929d;
    --gray-l:#6b7280;
    --bg:#1c1f25;
    --card:#20242b;
    --muted:#a3a9b3;
    --line:rgba(255,255,255,.09);
    --sans: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --mono: ui-monospace, "Cascadia Code", "SF Mono", Consolas, "Roboto Mono", monospace;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:transparent;color:var(--ink);font-family:var(--sans);overflow-x:hidden;-webkit-font-smoothing:antialiased;}
  a{color:inherit;text-decoration:none;}
  ::selection{background:var(--gold);color:#1c1c1c;}

  .canvas-bg{
    position:fixed;inset:0;z-index:-1;
    overflow:hidden;
    background:
      radial-gradient(circle, rgba(255,255,255,.05) 1px, transparent 1px) 0 0/24px 24px,
      linear-gradient(180deg, #21252c 0%, #14161a 100%);
  }
  .canvas-bg::after{
    content:"";
    position:absolute;inset:0;
    background:radial-gradient(ellipse at 50% 45%, transparent 55%, rgba(0,0,0,.35) 100%);
  }
  #particleCanvas{
    position:absolute;inset:0;
    width:100%;height:100%;
  }
  .orb{
    position:absolute;
    border-radius:50%;
    filter:blur(70px);
    opacity:.6;
    animation:drift ease-in-out infinite alternate;
  }
  .orb-a{
    width:520px;height:520px;left:-140px;top:-140px;
    background:radial-gradient(circle, rgba(242,168,29,.3), transparent 70%);
    animation-duration:26s;
  }
  .orb-b{
    width:600px;height:600px;right:-180px;top:12%;
    background:radial-gradient(circle, rgba(170,180,196,.16), transparent 70%);
    animation-duration:33s;
    animation-delay:-6s;
  }
  .orb-c{
    width:480px;height:480px;left:6%;bottom:-200px;
    background:radial-gradient(circle, rgba(255,201,61,.22), transparent 70%);
    animation-duration:29s;
    animation-delay:-14s;
  }
  @keyframes drift{
    0%{transform:translate(0,0) scale(1);}
    50%{transform:translate(48px,-34px) scale(1.09);}
    100%{transform:translate(-34px,26px) scale(1);}
  }

  /* ---------- HERO ---------- */
  .hero{
    position:relative;
    min-height:auto;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:2.75rem 1.5rem .9rem;
  }
  .hero-glow{
    position:absolute;
    width:60vw;height:60vw;
    max-width:900px;max-height:900px;
    border-radius:50%;
    left:50%;top:50%;
    transform:translate(-50%,-50%);
    background:radial-gradient(circle, rgba(242,168,29,.16) 0%, rgba(242,168,29,.05) 45%, transparent 72%);
    animation:breathe 9s ease-in-out infinite;
    pointer-events:none;
  }
  @keyframes breathe{
    0%,100%{opacity:.7;transform:translate(-50%,-50%) scale(1);}
    50%{opacity:1;transform:translate(-50%,-50%) scale(1.06);}
  }
  .hero-inner{position:relative;z-index:2;max-width:760px;}
  .hero-lockup{
    display:flex;
    align-items:center;
    justify-content:center;
    flex-wrap:wrap;
    gap:.7rem;
    width:100%;
    margin:0 auto;
    text-align:center;
  }
  .logo-mark{
    display:block;
    width:min(50vw, 300px);
    height:auto;
  }
  .suite-label{
    font-size:clamp(1.6rem, 4.8vw, 2.6rem);
    font-weight:300;
    letter-spacing:-.02em;
    line-height:1;
    color:var(--gold);
  }
  .tagline{
    margin:.7rem 0 0;
    font-size:clamp(1.05rem,2.2vw,1.3rem);
    font-weight:300;
    color:#c7ccd4;
    letter-spacing:-.005em;
  }
  /* ---------- BOARD ---------- */
  .board{
    position:relative;
    max-width:1120px;
    margin:0 auto;
    padding:2.5rem 1.5rem 2rem;
  }
  .grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:1rem;
  }
  @media (max-width:900px){.grid{grid-template-columns:repeat(2,1fr);}}
  @media (max-width:600px){.grid{grid-template-columns:1fr;}}

  .social-bar{
    position:relative;z-index:1;
    display:flex;
    justify-content:center;
    align-items:center;
    gap:1.1rem;
    padding:1.25rem 1.5rem 3rem;
  }
  .social-bar a{
    width:46px;height:46px;
    border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    color:var(--gold-l);
    border:1px solid rgba(242,168,29,.3);
    background:rgba(242,168,29,.06);
    animation:socialPulse 3.2s ease-in-out infinite;
    transition:color .2s ease, border-color .2s ease, transform .2s ease, background .2s ease, box-shadow .2s ease;
  }
  .social-bar a:nth-child(2){animation-delay:.5s;}
  .social-bar a:nth-child(3){animation-delay:1s;}
  .social-bar a:nth-child(4){animation-delay:1.5s;}
  @keyframes socialPulse{
    0%,100%{ box-shadow:0 0 0 0 rgba(242,168,29,.3); border-color:rgba(242,168,29,.28); }
    50%{ box-shadow:0 0 12px 2px rgba(242,168,29,.4); border-color:rgba(242,168,29,.6); }
  }
  .social-bar svg{width:19px;height:19px;}
  .social-bar a:hover{
    color:#241c04;
    border-color:var(--gold);
    background:var(--gold);
    transform:translateY(-2px);
  }
  .social-bar a:focus-visible{outline:2px solid var(--gold);outline-offset:2px;}

  .card{
    position:relative;
    background:rgba(255,255,255,.05);
    backdrop-filter:blur(18px) saturate(160%);
    -webkit-backdrop-filter:blur(18px) saturate(160%);
    border:1px solid rgba(255,255,255,.09);
    border-radius:20px;
    padding:1.9rem 1.7rem;
    text-align:left;
    cursor:pointer;
    display:flex;
    flex-direction:column;
    gap:1.1rem;
    min-height:172px;
    overflow:hidden;
    box-shadow:0 1px 2px rgba(0,0,0,.2);
    transition:transform .35s cubic-bezier(.2,.8,.3,1), box-shadow .35s ease, border-color .35s ease, background .35s ease;
  }
  .card::before{
    content:"";
    position:absolute;top:0;left:0;right:0;height:3px;
    background:linear-gradient(90deg,var(--gold-l),var(--gold),var(--gold-d));
    transform:scaleX(0);
    transform-origin:left;
    transition:transform .4s cubic-bezier(.2,.8,.3,1);
    z-index:2;
  }
  .card::after{
    content:"";
    position:absolute;inset:0;
    border-radius:inherit;
    background:radial-gradient(280px circle at var(--mx,50%) var(--my,50%), rgba(242,168,29,.16), transparent 68%);
    opacity:0;
    transition:opacity .4s ease;
    pointer-events:none;
  }
  .card:hover{
    transform:translateY(-4px);
    border-color:transparent;
    box-shadow:0 22px 42px -22px rgba(0,0,0,.55), 0 0 0 1px var(--line), 0 0 28px -10px rgba(242,168,29,.25);
  }
  .card:hover::before{transform:scaleX(1);}
  .card:hover::after{opacity:1;}
  .card:focus-visible{outline:2px solid var(--gold);outline-offset:3px;}

  @keyframes cardPulse{
    0%{ box-shadow:0 1px 2px rgba(0,0,0,.2), 0 0 0 0 rgba(255,201,61,0); }
    38%{ transform:scale(1.035); box-shadow:0 24px 46px -20px rgba(0,0,0,.55), 0 0 0 5px rgba(255,201,61,.4), 0 0 26px 6px rgba(255,201,61,.3); }
    100%{ transform:scale(1); box-shadow:0 1px 2px rgba(0,0,0,.2), 0 0 0 0 rgba(255,201,61,0); }
  }
  .card.pulse{animation:cardPulse .42s cubic-bezier(.25,.7,.3,1);}

  .glyph{
    position:relative;z-index:1;
    width:38px;height:38px;
    border-radius:11px;
    display:flex;align-items:center;justify-content:center;
    background:var(--bg);
    border:1px solid var(--line);
    font-family:var(--mono);
    font-size:.8rem;
    font-weight:600;
    letter-spacing:.02em;
    color:var(--ink2);
    transition:background .35s ease, color .35s ease, border-color .35s ease;
  }
  .card:hover .glyph{background:var(--gold);color:#2c2308;border-color:var(--gold);}

  .media-banner{
    position:relative;z-index:3;
    display:block;
    width:100%;
    aspect-ratio:3/1;
    object-fit:cover;
    border-radius:14px;
    border:1px solid rgba(255,255,255,.1);
    box-shadow:0 1px 2px rgba(0,0,0,.25);
    margin-bottom:.2rem;
  }
  .panel-banner{
    border-radius:16px;
    margin-bottom:1rem;
  }
  .card-kind{
    position:relative;z-index:1;
    align-self:flex-end;
    display:flex;align-items:center;gap:.4rem;
    font-family:var(--mono);
    font-size:.66rem;
    font-weight:600;
    letter-spacing:.04em;
    text-transform:uppercase;
    color:var(--gray);
    background:var(--bg);
    padding:.28rem .6rem;
    border-radius:100px;
  }
  .status-dot{
    width:6px;height:6px;border-radius:50%;
    background:var(--gold);
    flex-shrink:0;
    animation:dotPulse 2.4s ease-in-out infinite;
  }
  @keyframes dotPulse{
    0%,100%{opacity:.5; box-shadow:0 0 0 0 rgba(242,168,29,.4);}
    50%{opacity:1; box-shadow:0 0 5px 2px rgba(242,168,29,.4);}
  }
  .card h3{
    position:relative;z-index:1;
    margin:0;
    font-size:1.15rem;
    font-weight:600;
    letter-spacing:-.01em;
    color:var(--ink);
  }
  .card p{
    position:relative;z-index:1;
    margin:-.6rem 0 0;
    font-size:.9rem;
    color:var(--muted);
    line-height:1.5;
    flex:1;
  }
  .card-foot{
    position:relative;z-index:1;
    display:flex;align-items:center;gap:.4rem;
    font-size:.85rem;
    font-weight:500;
    color:var(--gray);
  }
  .card-foot svg{width:14px;height:14px;transition:transform .35s ease;}
  .card:hover .card-foot{color:var(--gold-l);}
  .card:hover .card-foot svg{transform:translateX(3px);}

  .media-banner--placeholder{
    display:flex;align-items:center;justify-content:center;
    background:rgba(255,255,255,.03);
    border-style:dashed;
    border-color:rgba(255,255,255,.16);
    color:var(--gray);
    font-size:.72rem;
    letter-spacing:.03em;
    text-align:center;
  }

  /* ---------- OVERLAY / EXPANDED PANEL ---------- */
  .overlay{
    position:fixed;inset:0;z-index:50;
    background:rgba(8,9,12,.55);
    backdrop-filter:blur(14px) saturate(1.3);
    -webkit-backdrop-filter:blur(14px) saturate(1.3);
    display:flex;align-items:center;justify-content:center;
    padding:2rem 1.25rem;
    opacity:0;pointer-events:none;
    transition:opacity .3s ease;
  }
  .overlay.open{opacity:1;pointer-events:auto;}
  .panel{
    width:min(540px,100%);
    max-height:min(78vh,620px);
    overflow-y:auto;
    background:rgba(32,36,43,.55);
    backdrop-filter:blur(30px);
    -webkit-backdrop-filter:blur(30px);
    border-radius:26px;
    padding:3.6rem 2.1rem 2rem;
    transform:scale(.96) translateY(10px);
    opacity:0;
    transition:transform .38s cubic-bezier(.2,.8,.2,1), opacity .3s ease;
    box-shadow:
      0 30px 70px -24px rgba(0,0,0,.6),
      inset 0 1px 0 rgba(255,255,255,.08);
    position:relative;
  }
  @property --border-angle{
    syntax:'<angle>';
    initial-value:0deg;
    inherits:false;
  }
  .panel::before{
    content:"";
    position:absolute;inset:0;
    border-radius:inherit;
    padding:1px;
    background:conic-gradient(from var(--border-angle) at 50% 50%,
      rgba(255,255,255,.7), rgba(242,168,29,.5), rgba(255,201,61,.6),
      rgba(255,255,255,.15), rgba(242,168,29,.5), rgba(255,255,255,.7));
    -webkit-mask:linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite:xor;
    mask-composite:exclude;
    animation:borderSpin 7s linear infinite, borderBreathe 3.4s ease-in-out infinite;
    pointer-events:none;
  }
  @keyframes borderSpin{ to{ --border-angle:360deg; } }
  @keyframes borderBreathe{ 0%,100%{opacity:.35;} 50%{opacity:.8;} }
  .overlay.open .panel{transform:scale(1) translateY(0);opacity:1;}
  .panel-close{
    position:absolute;z-index:5;top:1.25rem;right:1.25rem;
    width:32px;height:32px;border-radius:50%;
    border:1px solid rgba(255,255,255,.12);
    background:rgba(255,255,255,.06);
    backdrop-filter:blur(6px);
    cursor:pointer;font-size:.95rem;color:var(--muted);
    display:flex;align-items:center;justify-content:center;
    transition:background .2s ease,color .2s ease;
  }
  .panel-close:hover{background:var(--gold);color:#241c04;border-color:var(--gold);}
  .panel-glyph{
    width:44px;height:44px;border-radius:13px;
    display:flex;align-items:center;justify-content:center;
    background:linear-gradient(135deg, var(--gold-l), var(--gold) 65%, var(--gold-d));
    color:#2c2308;font-family:var(--mono);font-weight:600;font-size:.85rem;letter-spacing:.02em;
    box-shadow:0 8px 18px -8px rgba(207,141,11,.55);
    margin-bottom:1.2rem;
  }
  .panel-kind{
    display:inline-flex;align-items:center;gap:.4rem;
    font-family:var(--mono);font-size:.7rem;letter-spacing:.04em;text-transform:uppercase;
    color:var(--gray);font-weight:500;margin:.2rem 0 0 .6rem;
  }
  .panel h3{margin:0 0 .35rem;font-size:1.4rem;font-weight:600;letter-spacing:-.01em;color:var(--ink);}
  .panel > p{margin:0 0 1.6rem;color:var(--muted);font-size:.94rem;line-height:1.6;}
  .items{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:.6rem;}
  .items li a{
    display:flex;align-items:center;justify-content:space-between;gap:.75rem;
    padding:.95rem 1.15rem;
    border-radius:14px;
    background:linear-gradient(135deg, var(--gold-l), var(--gold));
    color:#241c04;
    font-size:.97rem;
    font-weight:700;
    box-shadow:0 4px 12px -3px rgba(242,168,29,.4);
    transition:transform .15s ease, box-shadow .15s ease, filter .15s ease;
  }
  .items li a .item-go{
    font-size:1.05rem;
    opacity:.75;
    transition:transform .15s ease;
  }
  .items li a:hover{filter:brightness(1.08);box-shadow:0 6px 16px -2px rgba(242,168,29,.55);}
  .items li a:hover .item-go{transform:translateX(3px);}
  .items li a:active{transform:scale(.96);filter:brightness(.92);box-shadow:0 2px 6px -1px rgba(242,168,29,.45);}

  .items-whatsapp li a{
    background:linear-gradient(135deg, #34e07f, #1fbf5c);
    color:#052411;
    box-shadow:0 4px 12px -3px rgba(37,211,102,.45);
  }
  .items-whatsapp li a:hover{box-shadow:0 6px 16px -2px rgba(37,211,102,.6);}
  .items-whatsapp li a:active{box-shadow:0 2px 6px -1px rgba(37,211,102,.5);}

  @media (prefers-reduced-motion:reduce){
    .card, .card:hover, .panel, .panel::before, .overlay, .hero-glow, .status-dot, .orb, .social-bar a{transition:none !important;animation:none !important;}
    .card:hover{transform:none;}
    .card.pulse{animation:none !important;}
    .panel::before{opacity:.55;}
    .status-dot{opacity:.9;}
    .social-bar a{border-color:rgba(242,168,29,.45);}
  }
</style>
</head>
<body>

<div class="canvas-bg">
  <div class="orb orb-a"></div>
  <div class="orb orb-b"></div>
  <div class="orb orb-c"></div>
  <canvas id="particleCanvas"></canvas>
</div>

<div id="media-assets" style="display:none">
  <img id="asset-academy" src="img/academy.png" alt="">
  <img id="asset-presentaciones" src="img/presentaciones.png" alt="">
  <img id="asset-dashboards" src="img/dashboards.png" alt="">
  <img id="asset-recursos-comerciales" src="img/recursos-comerciales.png" alt="">
  <img id="asset-recursos-digitales" src="img/recursos-digitales.png" alt="">
</div>

<div class="hero">
  <div class="hero-glow"></div>
  <div class="hero-inner">
    <div class="hero-lockup">
      <img class="logo-mark" src="img/logo-cantec.png" alt="CANTEC">
      <span class="suite-label">Suite</span>
    </div>
    <p class="tagline">Todo en un solo lugar.</p>
  </div>
</div>

<main class="board">

  <div class="grid" id="cardGrid"></div>
</main>

<footer class="social-bar">
  <a href="https://www.facebook.com/CANTEC.EDOMEX/" target="_blank" rel="noopener" aria-label="Facebook">
    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M13.5 21v-7.5h2.5l.4-3H13.5V8.2c0-.87.24-1.46 1.49-1.46H16.5V3.6c-.26-.04-1.15-.11-2.19-.11-2.17 0-3.66 1.33-3.66 3.76V10.5H8v3h2.65V21h2.85z"/></svg>
  </a>
  <a href="https://www.tiktok.com/@_cantec?lang=es" target="_blank" rel="noopener" aria-label="TikTok">
    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M16.5 3c.3 2 1.8 3.7 3.8 4v3c-1.4 0-2.7-.4-3.8-1.2v6.4c0 3.3-2.7 6-6 6a6 6 0 0 1-1.8-11.7v3.2a2.9 2.9 0 1 0 3.6 2.8V3h4.2z"/></svg>
  </a>
  <a href="https://mx.linkedin.com/company/grupo-cantec" target="_blank" rel="noopener" aria-label="LinkedIn">
    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6.94 8.5H3.56V20h3.38V8.5zM5.25 3.5a1.97 1.97 0 1 0 0 3.94 1.97 1.97 0 0 0 0-3.94zM20.5 20h-3.37v-5.9c0-1.4-.03-3.2-1.95-3.2-1.96 0-2.26 1.53-2.26 3.1V20H9.55V8.5h3.24v1.57h.05c.45-.85 1.56-1.75 3.2-1.75 3.42 0 4.06 2.25 4.06 5.18V20z"/></svg>
  </a>
  <a href="https://www.grupocantec.com/" target="_blank" rel="noopener" aria-label="Sitio web de Cantec">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.6 3.8 5.7 3.8 9s-1.3 6.4-3.8 9c-2.5-2.6-3.8-5.7-3.8-9S9.5 5.6 12 3z"/></svg>
  </a>
</footer>

<div class="overlay" id="overlay">
  <div class="panel" id="panel" role="dialog" aria-modal="true">
    <button class="panel-close" id="panelClose" aria-label="Cerrar">✕</button>
    <div id="panelContent"></div>
  </div>
</div>

<script>
(function(){

  (function particleField(){
    var canvas = document.getElementById("particleCanvas");
    var ctx = canvas.getContext("2d");
    var reduceMotionField = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    var w, h, particles = [];
    var COLORS = ["rgba(242,168,29,.55)", "rgba(255,201,61,.5)", "rgba(200,206,216,.35)"];
    var LINK_DIST = 130;

    function resize(){
      w = window.innerWidth;
      h = window.innerHeight;
      canvas.width = w * dpr;
      canvas.height = h * dpr;
      ctx.setTransform(dpr,0,0,dpr,0,0);
      var count = Math.max(40, Math.min(120, Math.floor((w*h)/16000)));
      particles = [];
      for(var i=0;i<count;i++){
        particles.push({
          x: Math.random()*w,
          y: Math.random()*h,
          r: 1 + Math.random()*1.6,
          vx: (Math.random()-0.5)*0.22,
          vy: (Math.random()-0.5)*0.22,
          c: COLORS[Math.floor(Math.random()*COLORS.length)]
        });
      }
    }

    function frame(){
      ctx.clearRect(0,0,w,h);
      for(var i=0;i<particles.length;i++){
        var p = particles[i];
        p.x += p.vx; p.y += p.vy;
        if(p.x < -20) p.x = w+20; if(p.x > w+20) p.x = -20;
        if(p.y < -20) p.y = h+20; if(p.y > h+20) p.y = -20;
      }
      for(var i=0;i<particles.length;i++){
        for(var j=i+1;j<particles.length;j++){
          var a = particles[i], b = particles[j];
          var dx = a.x-b.x, dy = a.y-b.y;
          var dist = Math.sqrt(dx*dx+dy*dy);
          if(dist < LINK_DIST){
            ctx.beginPath();
            ctx.moveTo(a.x,a.y);
            ctx.lineTo(b.x,b.y);
            ctx.strokeStyle = "rgba(160,168,180," + ((1-dist/LINK_DIST)*.14) + ")";
            ctx.lineWidth = 1;
            ctx.stroke();
          }
        }
      }
      particles.forEach(function(p){
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI*2);
        ctx.fillStyle = p.c;
        ctx.fill();
      });
      if(!reduceMotionField) requestAnimationFrame(frame);
    }

    resize();
    frame();
    window.addEventListener("resize", resize);
  })();

  var ARROW = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';
  var reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  var DATA = [
    {
      id:"presentaciones",
      glyph:"GP",
      kind:"Enlace",
      image:true,
      title:"Generador de presentaciones",
      desc:"Prompt oficial de marca y los zips de trabajo para armar cualquier deck.",
      items:[
        {label:"Generador de presentaciones", href:"https://cantec-guia-prompt.netlify.app/", tag:"→"}
      ]
    },
    {
      id:"dashboards",
      glyph:"HD",
      kind:"Enlace",
      image:true,
      title:"Hub de Dashboards",
      desc:"Los tableros en vivo de cada cuenta, en un solo directorio.",
      items:[
        {label:"HUB de Data (Cantec)", href:"https://www.grupocantec.com/hub-data", tag:"→"}
      ]
    },
    {
      id:"recursos-digitales",
      glyph:"RD",
      kind:"Descargas",
      image:true,
      title:"Recursos Digitales",
      desc:"Consulta y descarga de documentación oficial: identidad visual, plantillas, decks institucionales y avisos internos.",
      items:[
        {label:"Cantec", href:"https://drive.google.com/drive/folders/1U1VqKpY-lb5mHMqt-cttd7Ijz_MotMG0?usp=drive_link", tag:"↓"},
        {label:"Family Card Health", href:"https://drive.google.com/drive/folders/1Jpyb6h-Y0-X4eaH-uxh_6psL8tqjF7ug?usp=drive_link", tag:"↓"}
      ]
    },
    {
      id:"academy",
      glyph:"CA",
      kind:"Enlace",
      image:true,
      title:"Cantec Academy",
      desc:"Slides y formación interna del equipo.",
      items:[
        {label:"Cantec Academy — Slides", href:"https://cantec.odoo.com/slides", tag:"→"}
      ]
    },
    {
      id:"recursos-comerciales",
      glyph:"RC",
      kind:"Descargas",
      image:true,
      title:"Recursos Comerciales",
      desc:"Todo lo necesario para una conversación comercial.",
      items:[
        {label:"Presentaciones y brochures", href:"https://drive.google.com/drive/folders/1i3-FnNlySUaPV1RM5snABbxce05XBSOI?usp=sharing", tag:"↓"},
        {label:"Cotizador (beta)", href:"#", tag:"→"}
      ]
    },
    {
      id:"comunidades",
      kind:"Comunidad",
      image:true,
      whatsapp:true,
      title:"Comunidades CANTEC",
      desc:"Únete al canal de difusión de WhatsApp de tu país.",
      items:[
        {label:"CANTEC México", href:"https://chat.whatsapp.com/CeqGUIJsaVf9udkDeaHt4N", tag:"→"},
        {label:"CANTEC Ecuador", href:"https://chat.whatsapp.com/Lr5SBRroIVh71nf7SmUsZB", tag:"→"}
      ]
    }
  ];

  function getAssetSrc(id){
    return (document.getElementById("asset-" + id) || {}).src || "";
  }
  var grid = document.getElementById("cardGrid");

  DATA.forEach(function(entry){
    var card = document.createElement("button");
    card.className = "card";
    card.setAttribute("data-id", entry.id);
    var hasAsset = !!document.getElementById("asset-" + entry.id);
    var media = entry.image
      ? (hasAsset ? '<img class="media-banner" alt="">' : '<div class="media-banner media-banner--placeholder">Imagen próximamente</div>')
      : '<span class="glyph">' + entry.glyph + '</span>';
    card.innerHTML =
      '<span class="card-kind"><span class="status-dot"></span>' + entry.kind + '</span>' +
      media +
      '<h3>' + entry.title + '</h3>' +
      '<p>' + entry.desc + '</p>' +
      '<div class="card-foot"><span>Ver panel</span>' + ARROW + '</div>';
    if(entry.image && hasAsset){
      var banner = card.querySelector(".media-banner");
      if(banner) banner.src = getAssetSrc(entry.id);
    }
    card.addEventListener("click", function(){ handleCardClick(card, entry); });
    if(!reduceMotion){
      card.addEventListener("mousemove", function(e){
        var r = card.getBoundingClientRect();
        card.style.setProperty("--mx", (e.clientX - r.left) + "px");
        card.style.setProperty("--my", (e.clientY - r.top) + "px");
      });
    }
    grid.appendChild(card);
  });

  function handleCardClick(card, entry){
    if(reduceMotion){ openPanel(entry); return; }
    card.classList.add("pulse");
    card.addEventListener("animationend", function onEnd(){
      card.classList.remove("pulse");
      card.removeEventListener("animationend", onEnd);
    });
    setTimeout(function(){ openPanel(entry); }, 160);
  }

  var overlay = document.getElementById("overlay");
  var panelContent = document.getElementById("panelContent");
  var panelClose = document.getElementById("panelClose");
  var lastFocused = null;

  function openPanel(entry){
    lastFocused = document.activeElement;
    var itemsHtml = entry.items.map(function(it){
      return '<li><a href="' + it.href + '" target="_blank" rel="noopener"><span>' + it.label + '</span><span class="item-go">' + it.tag + '</span></a></li>';
    }).join("");

    var hasAsset = !!document.getElementById("asset-" + entry.id);
    var media = entry.image
      ? (hasAsset ? '<img class="media-banner panel-banner" alt="">' : '<div class="media-banner panel-banner media-banner--placeholder">Imagen próximamente</div>')
      : '<span class="panel-glyph">' + entry.glyph + '</span>';

    panelContent.innerHTML =
      media + '<span class="panel-kind"><span class="status-dot"></span>' + entry.kind + '</span>' +
      '<h3>' + entry.title + '</h3>' +
      '<p>' + entry.desc + '</p>' +
      '<ul class="items' + (entry.whatsapp ? ' items-whatsapp' : '') + '">' + itemsHtml + '</ul>';

    if(entry.image && hasAsset){
      var panelBanner = panelContent.querySelector(".media-banner");
      if(panelBanner) panelBanner.src = getAssetSrc(entry.id);
    }

    overlay.classList.add("open");
    panelClose.focus();
    document.body.style.overflow = "hidden";
  }

  function closePanel(){
    overlay.classList.remove("open");
    document.body.style.overflow = "";
    if(lastFocused) lastFocused.focus();
  }

  panelClose.addEventListener("click", closePanel);
  overlay.addEventListener("click", function(e){ if(e.target === overlay) closePanel(); });
  document.addEventListener("keydown", function(e){ if(e.key === "Escape") closePanel(); });

})();
</script>
</body>
</html>
